<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bankroll – Poker &amp; Casino</title>
<meta name="theme-color" content="#0e1311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bankroll">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#0e1311; --card:#161d1a; --card2:#1d2622; --line:#2a3530;
  --text:#eef3f0; --mute:#8fa39a; --win:#3ddc84; --loss:#ff5f5f;
  --accent:#e8c26a; --accent2:#2f8f6a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(84px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 20px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--accent)}
.sync{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--win)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);padding:7px 12px;border-radius:999px;font-size:13px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#17251f,#121a17);}
.label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.big{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--loss)} .zero{color:var(--text)}
.sub{font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin:0}
.mid{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.stats .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--mute);font-size:12px}
svg{display:block;width:100%;height:auto}
.split{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srow .n{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--card2)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12px;color:var(--mute)}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item .amt small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.month{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 6px;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.empty .e{font-size:40px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,19,17,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
nav button{background:none;border:0;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--text)}
nav .add{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#1b1608;font-size:30px;font-weight:300;margin:-22px auto 0;box-shadow:0 6px 20px rgba(232,194,106,.35);justify-content:center}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.x{background:var(--card2);border:0;color:var(--mute);width:30px;height:30px;border-radius:50%;font-size:16px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px 4px;border-radius:9px;font-size:14px;font-weight:500}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--mute);margin:0 0 5px 2px}
.f input,.f textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{background:var(--card2);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.preview b{font-size:20px;font-variant-numeric:tabular-nums}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--accent);color:#1b1608}
.btn.ghost{background:transparent;color:var(--loss);border:1px solid #4a2626;margin-top:8px;font-weight:600}
.btn:disabled{opacity:.4}
.err{color:var(--loss);font-size:13px;margin:-4px 0 10px 2px;min-height:0}
.confirm{display:none;background:#2a1717;border:1px solid #4a2626;border-radius:12px;padding:12px;margin-top:8px}
.confirm.show{display:block}
.confirm p{margin:0 0 10px;font-size:14px}
.confirm .r{display:flex;gap:8px}
.confirm button{flex:1;border-radius:10px;padding:10px;border:0;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:18px 10px 0;line-height:1.5}
.hint a{color:var(--mute)}
.btns{display:flex;flex-direction:column;gap:8px}
.btn.sec{background:var(--card2);color:var(--text)}
html{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bank<span>roll</span></h1>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Lädt…</span></div>
  </header>
  <div class="chips" id="chips"></div>
  <main id="view"></main>
</div>

<nav><div class="in">
  <button data-v="home" class="on"><span class="i">◎</span>Übersicht</button>
  <button data-v="poker"><span class="i">♠</span>Poker</button>
  <button class="add" id="addBtn" aria-label="Eintrag hinzufügen">+</button>
  <button data-v="casino"><span class="i">🎰</span>Casino</button>
  <button data-v="list"><span class="i">☰</span>Verlauf</button>
</div></nav>

<div class="ov" id="ov">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h3><span id="sheetTitle">Neuer Eintrag</span><button class="x" id="closeBtn">✕</button></h3>
    <div class="seg" id="segType">
      <button data-val="poker">♠ Poker</button>
      <button data-val="casino">🎰 Casino</button>
    </div>
    <div class="seg" id="segWhere">
      <button data-val="online">💻 Online</button>
      <button data-val="live">🏛 Vor Ort</button>
    </div>
    <div class="seg" id="segGame">
      <button data-val="cash">Cash Game</button>
      <button data-val="tournament">Turnier</button>
    </div>
    <div class="row2">
      <div class="f"><label>Datum</label><input type="date" id="fDate"></div>
      <div class="f" id="durWrap"><label>Dauer (Std., optional)</label><input type="number" inputmode="decimal" step="0.25" min="0" id="fDur" placeholder="z. B. 3.5"></div>
    </div>
    <div class="f"><label id="placeLbl">Ort / Plattform</label><input type="text" id="fPlace" list="places" placeholder="z. B. Grand Casino Baden"><datalist id="places"></datalist></div>
    <div class="row2">
      <div class="f"><label id="inLbl">Buy-in (CHF)</label><input type="number" inputmode="decimal" step="0.01" min="0" id="fIn" placeholder="0.00"></div>
      <div class="f"><label id="outLbl">Auszahlung (CHF)</label><input type="number" inputmode="decimal" step="0.01" min="0" id="fOut" placeholder="0.00"></div>
    </div>
    <div class="preview"><span class="sub">Ergebnis</span><b id="prev">CHF 0.00</b></div>
    <div class="f"><label>Notiz (optional)</label><textarea id="fNote" rows="2" placeholder="z. B. NL 1/2, gut gelaufen"></textarea></div>
    <div class="err" id="err"></div>
    <button class="btn" id="saveBtn">Speichern</button>
    <button class="btn ghost" id="delBtn">Eintrag löschen</button>
    <div class="confirm" id="confirm">
      <p>Diesen Eintrag wirklich löschen?</p>
      <div class="r"><button id="noDel" style="background:var(--card2);color:var(--text)">Abbrechen</button><button id="yesDel" style="background:var(--loss);color:#fff">Löschen</button></div>
    </div>
  </div>
</div>
<div class="ov" id="ovImp">
  <div class="sheet">
    <div class="grab"></div>
    <h3><span>Daten importieren</span><button class="x" id="impClose">✕</button></h3>
    <div class="sub" style="margin-bottom:10px">Füge hier die CSV-Tabelle ein (z. B. aus «CSV kopieren» im alten Bankroll-Artefakt) oder wähle eine gesicherte CSV-Datei. Bereits vorhandene Einträge werden übersprungen.</div>
    <div class="f"><textarea id="impTxt" rows="7" placeholder="Datum;Kategorie;Wo;Spielart;…"></textarea></div>
    <div class="err" id="impErr"></div>
    <div class="btns">
      <button class="btn" id="impGo">Importieren</button>
      <label class="btn sec" style="text-align:center">CSV-Datei wählen<input type="file" id="impFile" accept=".csv,text/csv,text/plain" hidden></label>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const S={entries:[],view:'home',period:'all'};
const LS='bankroll.entries.v1';
const PERIODS=[['all','Alles'],['month','Dieser Monat'],['30','30 Tage'],['year','Dieses Jahr'],['lastyear','Letztes Jahr']];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

/* ---------- helpers ---------- */
const fmt=(n,sign)=>{const a=Math.abs(n).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});return (sign?(n>0?'+':n<0?'−':''):(n<0?'−':''))+'CHF '+a};
const cls=n=>n>0.004?'pos':n<-0.004?'neg':'zero';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const net=e=>(+e.cashout||0)-(+e.buyin||0);
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fdate=s=>{const d=pd(s);return d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear()};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
function sorted(arr){return arr.slice().sort((a,b)=>a.date===b.date?(a.ts||0)-(b.ts||0):a.date<b.date?-1:1)}
function inPeriod(e){
  if(S.period==='all')return true;
  const d=pd(e.date),n=new Date();
  if(S.period==='month')return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
  if(S.period==='year')return d.getFullYear()===n.getFullYear();
  if(S.period==='lastyear')return d.getFullYear()===n.getFullYear()-1;
  if(S.period==='30'){const c=new Date(n.getFullYear(),n.getMonth(),n.getDate()-29);return d>=c}
  return true;
}

/* ---------- storage ---------- */
function loadLocal(){try{S.entries=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){S.entries=[]}}
function saveLocal(){localStorage.setItem(LS,JSON.stringify(S.entries))}
function setSync(ok,txt){$('#dot').className='dot'+(ok?' ok':'');$('#syncTxt').textContent=txt}
async function initStore(){
  loadLocal();render();
  setSync(true,'Auf diesem Gerät gespeichert');
  // Browser bitten, die Daten dauerhaft zu behalten
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
}
async function putEntry(e){
  const i=S.entries.findIndex(x=>x.id===e.id);
  if(i>=0)S.entries[i]=e;else S.entries.push(e);
  saveLocal();render();
}
async function delEntry(id){
  S.entries=S.entries.filter(x=>x.id!==id);saveLocal();render();
}

/* ---------- stats ---------- */
function agg(list){
  const r={n:list.length,net:0,in:0,out:0,wins:0,best:null,worst:null,hours:0,hNet:0};
  for(const e of list){
    const v=net(e);r.net+=v;r.in+=(+e.buyin||0);r.out+=(+e.cashout||0);
    if(v>0)r.wins++;
    if(r.best===null||v>r.best)r.best=v;
    if(r.worst===null||v<r.worst)r.worst=v;
    if(+e.hours>0){r.hours+=+e.hours;r.hNet+=v}
  }
  return r;
}

/* ---------- charts ---------- */
function lineChart(list){
  const s=sorted(list);
  if(s.length<2)return '<div class="sub" style="padding:18px 0;text-align:center">Ab 2 Einträgen erscheint hier dein Verlauf.</div>';
  const pts=[0];let c=0;for(const e of s){c+=net(e);pts.push(c)}
  const W=340,H=150,P=6;
  const mn=Math.min(0,...pts),mx=Math.max(0,...pts),rg=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>P+(mx-v)*(H-2*P)/rg;
  const d=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const z=y(0).toFixed(1);
  const end=pts[pts.length-1], col=end>=0?'var(--win)':'var(--loss)';
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${H+16}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${end>=0?'#3ddc84':'#ff5f5f'}" stop-opacity=".28"/><stop offset="1" stop-color="${end>=0?'#3ddc84':'#ff5f5f'}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P}" x2="${W-P}" y1="${z}" y2="${z}" stroke="#3a4741" stroke-dasharray="3 4"/>
    <path d="${d} L${x(pts.length-1).toFixed(1)} ${z} L${x(0)} ${z} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(end).toFixed(1)}" r="3.5" fill="${col}"/>
    <text x="${P}" y="${H+13}" fill="#8fa39a" font-size="10">${fdate(s[0].date)}</text>
    <text x="${W-P}" y="${H+13}" fill="#8fa39a" font-size="10" text-anchor="end">${fdate(s[s.length-1].date)}</text>
  </svg>`;
}
function monthChart(list){
  if(!list.length)return '';
  const m={};for(const e of list){const k=e.date.slice(0,7);m[k]=(m[k]||0)+net(e)}
  let keys=Object.keys(m).sort();
  // Lücken auffüllen, max. 12 Monate
  const first=keys[0],last=keys[keys.length-1];const all=[];
  let [y,mo]=first.split('-').map(Number);const [ly,lm]=last.split('-').map(Number);
  while(y<ly||(y===ly&&mo<=lm)){all.push(y+'-'+String(mo).padStart(2,'0'));mo++;if(mo>12){mo=1;y++}}
  keys=all.slice(-12);
  const vals=keys.map(k=>m[k]||0);
  const W=340,H=140,top=14,bot=20;
  const mx=Math.max(0,...vals),mn=Math.min(0,...vals),rg=(mx-mn)||1;
  const y0=top+mx*(H-top-bot)/rg;
  const bw=(W-8)/keys.length;
  let out='';
  keys.forEach((k,i)=>{
    const v=vals[i],h=Math.abs(v)*(H-top-bot)/rg,bx=4+i*bw+bw*0.18,w=bw*0.64;
    const by=v>=0?y0-h:y0;
    out+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="3" fill="${v>=0?'#3ddc84':'#ff5f5f'}" opacity="${v===0?.3:.9}"/>`;
    out+=`<text x="${(bx+w/2).toFixed(1)}" y="${H-5}" fill="#8fa39a" font-size="10" text-anchor="middle">${MON[+k.slice(5)-1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="4" x2="${W-4}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#3a4741"/>${out}</svg>`;
}
function splitRows(rows){
  const mx=Math.max(1,...rows.map(r=>Math.abs(r.net)));
  return '<div class="split">'+rows.map(r=>`<div><div class="srow"><span>${r.label} <span class="sub">· ${r.n} ${r.n===1?'Eintrag':'Einträge'}</span></span><span class="n ${cls(r.net)}">${fmt(r.net,true)}</span></div><div class="bar"><i style="width:${(Math.abs(r.net)/mx*100).toFixed(1)}%;background:${r.net>=0?'var(--win)':'var(--loss)'}"></i></div></div>`).join('')+'</div>';
}

/* ---------- list ---------- */
function itemHTML(e){
  const v=net(e);
  const ico=e.type==='poker'?'♠':'🎰';
  const where=e.where==='online'?'Online':'Vor Ort';
  const kind=e.type==='poker'?(e.game==='tournament'?'Turnier':'Cash Game')+' · '+where:'Casino · '+where;
  return `<div class="item" data-id="${esc(e.id)}"><div class="ico">${ico}</div><div class="t"><b>${esc(e.place||(e.type==='poker'?'Poker':'Casino'))}</b><span>${fdate(e.date)} · ${kind}</span></div><div class="amt ${cls(v)}">${fmt(v,true)}<small>Einsatz ${fmt(+e.buyin||0)}</small></div></div>`;
}
function listHTML(list,limit){
  const s=sorted(list).reverse();
  const show=limit?s.slice(0,limit):s;
  return '<div class="list">'+show.map(itemHTML).join('')+'</div>';
}
function groupedList(list){
  const s=sorted(list).reverse();const g={};const order=[];
  for(const e of s){const k=e.date.slice(0,7);if(!g[k]){g[k]=[];order.push(k)}g[k].push(e)}
  return order.map(k=>{const sum=g[k].reduce((a,e)=>a+net(e),0);const [y,m]=k.split('-');
    return `<div class="month"><span>${MONL[+m-1]} ${y}</span><span class="${cls(sum)}">${fmt(sum,true)}</span></div><div class="card" style="padding:4px 14px">${listHTML(g[k])}</div>`}).join('');
}
function emptyHTML(t){return `<div class="card empty"><div class="e">🃏</div><div>${t}</div><div style="margin-top:12px"><button class="btn" style="width:auto;padding:10px 18px" data-add="1">+ Ersten Eintrag erfassen</button></div>${S.entries.length?'':'<div style="margin-top:10px"><button class="btn sec" style="width:auto;padding:9px 16px;font-size:14px" data-imp="1">Daten aus Artefakt importieren</button></div>'}</div>`}

/* ---------- views ---------- */
function render(){
  $('#chips').innerHTML=PERIODS.map(([k,l])=>`<button class="chip${S.period===k?' on':''}" data-p="${k}">${l}</button>`).join('');
  document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const L=S.entries.filter(inPeriod);
  const P=L.filter(e=>e.type==='poker'), C=L.filter(e=>e.type==='casino');
  let h='';
  if(S.view==='home'){
    if(!L.length){h=emptyHTML(S.entries.length?'Keine Einträge in diesem Zeitraum.':'Noch keine Einträge. Tippe auf + um deine erste Session zu erfassen.')}
    else{
      const a=agg(L),p=agg(P),c=agg(C);
      h+=`<div class="card hero"><div class="label">Gesamtergebnis</div><div class="big ${cls(a.net)}">${fmt(a.net,true)}</div><div class="sub">${a.n} Einträge · Eingesetzt ${fmt(a.in)} · Ausgezahlt ${fmt(a.out)}</div></div>`;
      h+=`<div class="grid2"><div class="card"><div class="label">♠ Poker</div><div class="mid ${cls(p.net)}">${fmt(p.net,true)}</div><div class="sub">${p.n} ${p.n===1?"Session":"Sessions"}</div></div><div class="card"><div class="label">🎰 Casino</div><div class="mid ${cls(c.net)}">${fmt(c.net,true)}</div><div class="sub">${c.n} ${c.n===1?"Besuch":"Besuche"}</div></div></div>`;
      h+=`<div class="card"><h2>Verlauf <small>kumuliert</small></h2>${lineChart(L)}</div>`;
      h+=`<div class="card"><h2>Pro Monat</h2>${monthChart(L)}</div>`;
      const on=L.filter(e=>e.where==='online'),lv=L.filter(e=>e.where!=='online');
      h+=`<div class="card"><h2>Aufteilung</h2>${splitRows([
        {label:'♠ Poker online',...pick(agg(P.filter(e=>e.where==='online')))},
        {label:'♠ Poker live',...pick(agg(P.filter(e=>e.where!=='online')))},
        {label:'🎰 Online-Casino',...pick(agg(C.filter(e=>e.where==='online')))},
        {label:'🎰 Casino vor Ort',...pick(agg(C.filter(e=>e.where!=='online')))}
      ].filter(r=>r.n))}</div>`;
      h+=`<div class="card"><h2>Letzte Einträge <small>antippen zum Bearbeiten</small></h2>${listHTML(L,5)}</div>`;
    }
  }
  else if(S.view==='poker'){
    if(!P.length)h=emptyHTML('Noch keine Poker-Sessions'+(S.period!=='all'?' in diesem Zeitraum':'')+'.');
    else{
      const a=agg(P);
      h+=`<div class="card hero"><div class="label">♠ Poker-Ergebnis</div><div class="big ${cls(a.net)}">${fmt(a.net,true)}</div><div class="sub">${a.n} Sessions · Ø ${fmt(a.net/a.n,true)} pro Session</div></div>`;
      h+=`<div class="card"><div class="stats">
        ${st('Gewinn-Sessions',Math.round(a.wins/a.n*100)+' %',a.wins+' von '+a.n)}
        ${st('Stundenlohn',a.hours?fmt(a.hNet/a.hours,true)+'/h':'–',a.hours?a.hours.toLocaleString('de-CH')+' Std. erfasst':'Dauer erfassen')}
        ${st('Beste Session',fmt(a.best,true),'',cls(a.best))}
        ${st('Schlechteste',fmt(a.worst,true),'',cls(a.worst))}
        ${st('Total Buy-ins',fmt(a.in))}
        ${st('Total Auszahlung',fmt(a.out))}
      </div></div>`;
      h+=`<div class="card"><h2>Verlauf <small>kumuliert</small></h2>${lineChart(P)}</div>`;
      h+=`<div class="card"><h2>Nach Spielart</h2>${splitRows([
        {label:'Cash Game',...pick(agg(P.filter(e=>e.game!=='tournament')))},
        {label:'Turnier',...pick(agg(P.filter(e=>e.game==='tournament')))},
        {label:'Online',...pick(agg(P.filter(e=>e.where==='online')))},
        {label:'Live',...pick(agg(P.filter(e=>e.where!=='online')))}
      ].filter(r=>r.n))}</div>`;
      h+=placesCard(P);
      h+=`<div class="card"><h2>Sessions</h2>${listHTML(P)}</div>`;
    }
  }
  else if(S.view==='casino'){
    if(!C.length)h=emptyHTML('Noch keine Casino-Einträge'+(S.period!=='all'?' in diesem Zeitraum':'')+'.');
    else{
      const a=agg(C),on=agg(C.filter(e=>e.where==='online')),lv=agg(C.filter(e=>e.where!=='online'));
      const ret=a.in?Math.round(a.out/a.in*100):0;
      h+=`<div class="card hero"><div class="label">🎰 Casino-Ergebnis</div><div class="big ${cls(a.net)}">${fmt(a.net,true)}</div><div class="sub">Eingesetzt ${fmt(a.in)} · Ausgezahlt ${fmt(a.out)}</div></div>`;
      h+=`<div class="grid2"><div class="card"><div class="label">💻 Online</div><div class="mid ${cls(on.net)}">${fmt(on.net,true)}</div><div class="sub">${on.n}× · Einsatz ${fmt(on.in)}</div></div><div class="card"><div class="label">🏛 Vor Ort</div><div class="mid ${cls(lv.net)}">${fmt(lv.net,true)}</div><div class="sub">${lv.n}× · Einsatz ${fmt(lv.in)}</div></div></div>`;
      h+=`<div class="card"><div class="stats">
        ${st('Rückfluss',ret+' %','von jedem Franken zurück')}
        ${st('Gewinn-Besuche',Math.round(a.wins/a.n*100)+' %',a.wins+' von '+a.n)}
        ${st('Bester Tag',fmt(a.best,true),'',cls(a.best))}
        ${st('Schlechtester',fmt(a.worst,true),'',cls(a.worst))}
      </div></div>`;
      h+=`<div class="card"><h2>Verlauf <small>kumuliert</small></h2>${lineChart(C)}</div>`;
      h+=placesCard(C);
      h+=`<div class="card"><h2>Einträge</h2>${listHTML(C)}</div>`;
    }
  }
  else{
    if(!L.length)h=emptyHTML(S.entries.length?'Keine Einträge in diesem Zeitraum.':'Noch keine Einträge.');
    else{const a=agg(L);h+=`<div class="card"><div class="srow"><span class="sub">${a.n} Einträge im Zeitraum</span><b class="${cls(a.net)}">${fmt(a.net,true)}</b></div></div>`+groupedList(L);
      h+=`<div class="card" style="margin-top:14px"><h2>Daten sichern</h2><div class="sub" style="margin-bottom:10px">Deine Einträge liegen nur auf diesem Gerät. Sichere sie ab und zu als Tabelle (CSV) – z. B. in Dateien oder per Mail.</div><div class="btns"><button class="btn sec" id="csvFile">CSV-Datei sichern</button><button class="btn sec" id="csvBtn">CSV kopieren</button><button class="btn sec" data-imp="1">Daten importieren</button></div></div>`}
  }
  h+=`<div class="hint">Setz dir ein Limit und spiel nur mit Geld, dessen Verlust du verkraftest. Hilfe & Selbsttest: <a href="https://www.sos-spielsucht.ch">sos-spielsucht.ch</a> · Tel. 0800 040 080</div>`;
  $('#view').innerHTML=h;
}
const pick=a=>({n:a.n,net:a.net});
function st(l,v,s,c){return `<div><div class="label">${l}</div><div class="v ${c||''}">${v}</div>${s?`<div class="sub" style="font-size:11px">${s}</div>`:''}</div>`}
function placesCard(list){
  const m={};for(const e of list){const k=(e.place||'').trim()||'Ohne Angabe';(m[k]=m[k]||[]).push(e)}
  const rows=Object.entries(m).map(([k,v])=>({label:esc(k),...pick(agg(v))})).sort((a,b)=>b.net-a.net).slice(0,6);
  if(rows.length<2)return '';
  return `<div class="card"><h2>Nach Ort / Plattform</h2>${splitRows(rows)}</div>`;
}

/* ---------- form ---------- */
const F={id:null,type:'poker',where:'live',game:'cash'};
function segSet(sel,val){document.querySelectorAll(sel+' button').forEach(b=>b.classList.toggle('on',b.dataset.val===val))}
function updForm(){
  segSet('#segType',F.type);segSet('#segWhere',F.where);segSet('#segGame',F.game);
  const pk=F.type==='poker';
  $('#segGame').style.display=pk?'flex':'none';
  $('#durWrap').style.visibility=pk?'visible':'hidden';
  $('#inLbl').textContent=pk?(F.game==='tournament'?'Buy-in inkl. Re-Buys (CHF)':'Buy-in (CHF)'):'Eingesetzt (CHF)';
  $('#outLbl').textContent=pk?'Auszahlung (CHF)':'Ausgezahlt (CHF)';
  $('#placeLbl').textContent=F.where==='online'?'Plattform / Website':(pk?'Ort / Casino / Runde':'Casino');
  $('#fPlace').placeholder=F.where==='online'?(pk?'z. B. PokerStars':'z. B. mycasino.ch'):(pk?'z. B. Homegame bei Felix':'z. B. Grand Casino Baden');
  const places=[...new Set(S.entries.filter(e=>e.type===F.type&&e.where===F.where&&e.place).map(e=>e.place))];
  $('#places').innerHTML=places.map(p=>`<option value="${esc(p)}">`).join('');
  updPrev();
}
function updPrev(){const v=(parseFloat($('#fOut').value)||0)-(parseFloat($('#fIn').value)||0);const el=$('#prev');el.textContent=fmt(v,true);el.className=cls(v)}
function openForm(e){
  $('#err').textContent='';$('#confirm').classList.remove('show');
  if(e){Object.assign(F,{id:e.id,type:e.type,where:e.where||'live',game:e.game||'cash'});
    $('#fDate').value=e.date;$('#fIn').value=e.buyin??'';$('#fOut').value=e.cashout??'';$('#fPlace').value=e.place||'';$('#fNote').value=e.note||'';$('#fDur').value=e.hours||'';
    $('#sheetTitle').textContent='Eintrag bearbeiten';$('#delBtn').style.display='block';}
  else{F.id=null;if(S.view==='casino')F.type='casino';else if(S.view==='poker')F.type='poker';
    $('#fDate').value=today();$('#fIn').value='';$('#fOut').value='';$('#fPlace').value='';$('#fNote').value='';$('#fDur').value='';
    $('#sheetTitle').textContent='Neuer Eintrag';$('#delBtn').style.display='none';}
  updForm();$('#ov').classList.add('show');
}
function closeForm(){$('#ov').classList.remove('show')}
async function save(){
  const bi=$('#fIn').value.trim(),co=$('#fOut').value.trim(),date=$('#fDate').value;
  if(!date){$('#err').textContent='Bitte ein Datum wählen.';return}
  if(bi===''&&co===''){$('#err').textContent='Bitte Einsatz und/oder Auszahlung eingeben.';return}
  const b=parseFloat(bi)||0,c=parseFloat(co)||0;
  if(b<0||c<0){$('#err').textContent='Beträge dürfen nicht negativ sein.';return}
  const old=F.id?S.entries.find(x=>x.id===F.id):null;
  const e={id:F.id||('e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),type:F.type,where:F.where,date,buyin:Math.round(b*100)/100,cashout:Math.round(c*100)/100,place:$('#fPlace').value.trim().slice(0,80),note:$('#fNote').value.trim().slice(0,300),ts:old?.ts||Date.now()};
  if(F.type==='poker'){e.game=F.game;const h=parseFloat($('#fDur').value);if(h>0)e.hours=Math.round(h*100)/100}
  $('#saveBtn').disabled=true;
  try{await putEntry(e);closeForm();toast(F.id?'Änderung gespeichert':'Eintrag gespeichert')}
  catch(err){$('#err').textContent=err&&err.name==='QuotaExceededError'?'Speicher voll – bitte alte Einträge löschen.':'Speichern fehlgeschlagen. Bitte nochmals versuchen.'}
  finally{$('#saveBtn').disabled=false}
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-p],[data-v],[data-id],[data-add],[data-imp],#csvBtn,#csvFile');
  if(!t)return;
  if(t.dataset.p){S.period=t.dataset.p;render()}
  else if(t.dataset.v){S.view=t.dataset.v;render();window.scrollTo(0,0)}
  else if(t.dataset.id){const e=S.entries.find(x=>x.id===t.dataset.id);if(e)openForm(e)}
  else if(t.dataset.add)openForm();
  else if(t.dataset.imp)openImport();
  else if(t.id==='csvBtn')copyCSV();
  else if(t.id==='csvFile')saveCSV();
});
$('#addBtn').onclick=()=>openForm();
$('#closeBtn').onclick=closeForm;
$('#ov').addEventListener('click',ev=>{if(ev.target.id==='ov')closeForm()});
['#segType','#segWhere','#segGame'].forEach(s=>$(s).addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  const k=s==='#segType'?'type':s==='#segWhere'?'where':'game';F[k]=b.dataset.val;updForm()}));
$('#fIn').oninput=updPrev;$('#fOut').oninput=updPrev;
$('#saveBtn').onclick=save;
$('#delBtn').onclick=()=>$('#confirm').classList.add('show');
$('#noDel').onclick=()=>$('#confirm').classList.remove('show');
$('#yesDel').onclick=async()=>{try{await delEntry(F.id);closeForm();toast('Eintrag gelöscht')}catch(e){$('#err').textContent='Löschen fehlgeschlagen.'}};
function buildCSV(){
  const rows=[['Datum','Kategorie','Wo','Spielart','Ort/Plattform','Einsatz','Auszahlung','Ergebnis','Stunden','Notiz']];
  for(const e of sorted(S.entries))rows.push([e.date,e.type==='poker'?'Poker':'Casino',e.where==='online'?'Online':'Vor Ort',e.type==='poker'?(e.game==='tournament'?'Turnier':'Cash Game'):'',e.place||'',(+e.buyin||0).toFixed(2),(+e.cashout||0).toFixed(2),net(e).toFixed(2),e.hours||'',e.note||'']);
  return rows.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n');
}
async function copyCSV(){
  try{await navigator.clipboard.writeText(buildCSV());toast('CSV kopiert')}catch(e){toast('Kopieren nicht möglich')}
}
async function saveCSV(){
  const name='bankroll-'+today()+'.csv';
  const blob=new Blob(['﻿'+buildCSV()],{type:'text/csv'});
  try{
    const file=new File([blob],name,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Bankroll-Sicherung'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');
  const sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(v=>v.trim()))rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);if(row.some(v=>v.trim()))rows.push(row);
  return rows;
}
const num=v=>parseFloat(String(v||'').replace(/['’\s]/g,'').replace(',','.'))||0;
function importCSV(txt){
  const rows=parseCSV(txt);
  if(rows.length&&/datum/i.test(rows[0][0]))rows.shift();
  const key=e=>[e.date,e.type,e.where,(e.place||'').toLowerCase(),(+e.buyin||0).toFixed(2),(+e.cashout||0).toFixed(2)].join('|');
  const have=new Set(S.entries.map(key));
  let added=0,skipped=0,bad=0,ts=Date.now();
  for(const r of rows){
    let date=(r[0]||'').trim();
    const m=date.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if(m)date=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){bad++;continue}
    const type=/casino/i.test(r[1]||'')?'casino':'poker';
    const e={id:'e'+(ts++).toString(36)+Math.random().toString(36).slice(2,6),type,where:/online/i.test(r[2]||'')?'online':'live',date,
      buyin:Math.round(num(r[5])*100)/100,cashout:Math.round(num(r[6])*100)/100,place:(r[4]||'').trim().slice(0,80),note:(r[9]||'').trim().slice(0,300),ts};
    if(type==='poker'){e.game=/turnier|tournament/i.test(r[3]||'')?'tournament':'cash';const h=num(r[8]);if(h>0)e.hours=Math.round(h*100)/100}
    const k=key(e);if(have.has(k)){skipped++;continue}
    have.add(k);S.entries.push(e);added++;
  }
  if(added){try{saveLocal()}catch(e){loadLocal();throw e}render()}
  return {added,skipped,bad};
}
function openImport(){$('#impTxt').value='';$('#impErr').textContent='';$('#ovImp').classList.add('show')}
function closeImport(){$('#ovImp').classList.remove('show')}
function runImport(txt){
  if(!txt.trim()){$('#impErr').textContent='Bitte zuerst die CSV-Tabelle einfügen.';return}
  let r;try{r=importCSV(txt)}catch(e){$('#impErr').textContent='Speichern fehlgeschlagen – Speicher voll?';return}
  if(!r.added&&!r.skipped){$('#impErr').textContent='Keine gültigen Einträge gefunden.';return}
  closeImport();
  toast(r.added+' importiert'+(r.skipped?', '+r.skipped+' schon vorhanden':''));
}
$('#impClose').onclick=closeImport;
$('#ovImp').addEventListener('click',ev=>{if(ev.target.id==='ovImp')closeImport()});
$('#impGo').onclick=()=>runImport($('#impTxt').value);
$('#impFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{runImport(await f.text())}catch(e){$('#impErr').textContent='Datei konnte nicht gelesen werden.'}ev.target.value=''};

/* ---------- offline ---------- */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));

initStore();
})();
</script>
